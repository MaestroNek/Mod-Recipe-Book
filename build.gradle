plugins {
    id "architectury-plugin" version "3.4.162"
    id "dev.architectury.loom" version "1.11.458" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"

    base {
        archivesName = "${rootProject.mod_id}-${project.name}"
    }

    loom {
        silentMojangMappingsLicense()
    }

    // Those two hosts accept the request, then stall after ~16KB. The plugin adds the first one itself.
    def archLocal = rootProject.file("gradle/m2")
    repositories.removeAll { repo ->
        repo.hasProperty("url") && repo.url?.host in ["maven.architectury.dev", "maven.blamejared.com"]
    }
    repositories {
        if (archLocal.directory) {
            maven {
                url = archLocal
                metadataSources {
                    mavenPom()
                    artifact()
                    ignoreGradleMetadataRedirection()
                }
            }
        } else {
            maven {
                url = "https://maven.architectury.dev/"
                metadataSources {
                    mavenPom()
                    artifact()
                    ignoreGradleMetadataRedirection()
                }
            }
            maven { url = "https://maven.blamejared.com" }
        }
        maven { url = "https://maven.parchmentmc.org" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft_version}:${rootProject.parchment_mappings_version}@zip")
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
    }
}
